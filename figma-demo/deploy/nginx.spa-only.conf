server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Isolated partner deck — static only, never falls through to the SPA.
    location = /partner-deck {
        return 301 /partner-deck/;
    }
    location /partner-deck/ {
        try_files $uri $uri/ /partner-deck/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /cover-showcase {
        return 301 /cover-showcase/;
    }
    location /cover-showcase/ {
        try_files $uri $uri/ /cover-showcase/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
